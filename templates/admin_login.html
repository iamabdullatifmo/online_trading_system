<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShopEase | Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, Arial, sans-serif;

            background: #f1f5f9;

            color: #0f172a;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;

            background: white;

            border: 1px solid #e2e8f0;

            border-radius: 18px;

            padding: 35px;

            box-shadow:
                0 10px 35px
                rgba(15, 23, 42, 0.08);
        }

        .icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #eff6ff;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 32px;
        }

        .logo {
            text-align: center;

            font-size: 30px;

            font-weight: 800;

            margin-bottom: 8px;
        }

        .logo span {
            color: #2563eb;
        }

        .subtitle {
            text-align: center;

            color: #64748b;

            font-size: 14px;

            margin-bottom: 30px;
        }

        .flash {
            padding: 13px 15px;

            border-radius: 9px;

            margin-bottom: 20px;

            font-size: 14px;

            font-weight: 600;
        }

        .error {
            background: #fee2e2;

            color: #991b1b;

            border: 1px solid #fecaca;
        }

        .success {
            background: #dcfce7;

            color: #166534;

            border: 1px solid #bbf7d0;
        }

        .form-group {
            display: flex;

            flex-direction: column;

            margin-bottom: 20px;
        }

        label {
            font-size: 14px;

            font-weight: 700;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            height: 46px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            padding: 0 13px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.10);
        }

        input::placeholder {
            color: #94a3b8;
        }

        .login-button {
            width: 100%;

            height: 48px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .back-link {
            display: block;

            text-align: center;

            margin-top: 22px;

            color: #64748b;

            text-decoration: none;

            font-size: 14px;
        }

        .back-link:hover {
            color: #2563eb;
        }

        .security-note {
            text-align: center;

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #e2e8f0;

            color: #94a3b8;

            font-size: 12px;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 25px 20px;
            }

            .logo {
                font-size: 27px;
            }

        }

    </style>

</head>

<body>

    <div class="login-card">

        <div class="icon">
            🔐
        </div>

        <div class="logo">
            Shop<span>Ease</span>
        </div>

        <p class="subtitle">
            Administrator Login
        </p>


        <!-- FLASH MESSAGES -->

        {% with messages = get_flashed_messages(
            with_categories=true
        ) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- LOGIN FORM -->

        <form
            method="POST"
            action="{{ url_for('admin.admin_login') }}"
        >

            <!-- ADMIN NAME -->
<div class="form-group">

    <label for="username">
        Admin Name
    </label>

    <input
        type="text"
        id="username"
        name="username"
        placeholder="Enter admin name"
        autocomplete="username"
        required
    >

</div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Admin Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login as Administrator
            </button>

        </form>



        <div class="security-note">
            🔒 Authorized administrators only
        </div>

    </div>

</body>

</html>
